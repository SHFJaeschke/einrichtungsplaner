  // Round dining table home24 "Olson" (diameter 120, height 75 cm, top 1.8 cm): thin walnut-coloured top with a

    const fast = !!drag || camBusy || performance.now() - camMovedAt < 200;
    Realism.render(renderer, scene, camera, fast); // draws only after Realism.invalidate()/invalidateShadows()
  })();
})();
</script>
