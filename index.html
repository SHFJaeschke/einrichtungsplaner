<title>Einrichtungsplaner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one-screen tool. 3D view fills the space, a control panel sits beside it (below it on phones). */
:root {
  --bg: #eef0ec;
  --panel: #fbfcfa;
  --fg: #1e2622;
  --muted: #5d6a63;
  --line: #d5dad4;
  --field: #ffffff;
  --accent: #2f6b57;

  --warn-bg: #f6ecd2;
  --warn-fg: #5c4410;
  --danger: #a13a2a;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161b18; --panel: #1e2521; --fg: #e8ede9; --muted: #9aa8a0; --line: #343e38;
    --field: #161b18; --accent: #6fbf9f; --accent-fg: #0f1a15; --warn-bg: #3a3118; --warn-fg: #ecd9a0;
    --danger: #e58c7b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161b18; --panel: #1e2521; --fg: #e8ede9; --muted: #9aa8a0; --line: #343e38;
  --field: #161b18; --accent: #6fbf9f; --accent-fg: #0f1a15; --warn-bg: #3a3118; --warn-fg: #ecd9a0;
  --danger: #e58c7b; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
.app { display: flex; height: 100%; }
.view { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; }
.view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.toolbar {
  position: absolute; right: 16px;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-wrap: wrap; gap: 8px;
  pointer-events: none; /* only the button groups take the pointer; the space between them belongs to the view */
}
.toolbar .seg { pointer-events: auto; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--fg); padding: 7px 12px; font: inherit; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg[hidden], .seg button[hidden], .rvpad[hidden], .hint[hidden], .hint button[hidden], .view canvas[hidden] { display: none; }
.rvpad { position: absolute; inset: 0; cursor: grab; touch-action: none; }
.rvpad:active { cursor: grabbing; }
.rvpad canvas { position: absolute; inset: 0; pointer-events: none; }
#rvShot { opacity: 0; }
.seg .narrow { display: none; }
#rvShot.on { opacity: 1; transition: opacity .7s ease; }
@media (prefers-reduced-motion: reduce) { #rvShot.on { transition: none; } }
.rvstatus { font-variant-numeric: tabular-nums; }
.rvstatus button { font: inherit; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 5px; padding: 2px 9px; margin-left: 8px; cursor: pointer; }
.hint {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 12px;
  color: var(--muted); font-size: 12px; background: var(--panel); border: 1px solid var(--line);
  padding: 5px 9px; border-radius: 6px; max-width: calc(100% - 32px);
}
.panel {
  flex: 0 0 320px; background: var(--panel); border-left: 1px solid var(--line);
  overflow-y: auto; padding-block: 16px;
  padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h1 { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 13px; }
.note { background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; }
.catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
button.item, button.act {
  font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 9px; cursor: pointer; text-align: left;
}
button.item small { display: block; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
button.item:hover, button.act:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); text-align: center; }
button.danger { color: var(--danger); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: end; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--muted); flex: 1 1 60px; min-width: 0; }
#pFields label.f { flex-basis: 40%; }
label.f input, label.f select { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 6px 7px; width: 100%; font-variant-numeric: tabular-nums; }
label.f input[type="color"] { padding: 2px; height: 32px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.empty { color: var(--muted); font-size: 13px; }
@media (max-width: 760px) {
  .app { flex-direction: column; }
  .view { flex: 1 1 52%; }
  .panel { flex: 1 1 48%; border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .hint { display: none; }
  .hint.rvstatus:not([hidden]) { display: block; }
  .seg .wide { display: none; }
  .seg .narrow { display: inline; }
}
/* App shell (stand-alone app only). Every class is prefixed ax-; colours come from the page's tokens. */
body.ax { display: flex; flex-direction: column; }
body.ax .app { flex: 1 1 auto; min-height: 0; height: auto; }
.ax-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.ax-brand { font-family: var(--font-display); font-weight: 600; font-size: 16px; white-space: nowrap; }
.ax-flat { min-width: 0; flex: 0 1 280px; }
.ax-flat select { width: 100%; font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line-strong, var(--line)); border-radius: 8px; padding: 7px 9px; }
.ax-grow { flex: 1 1 auto; }
.ax-status { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* Buttons, inputs */
.ax-btn { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; line-height: 1.3; }
.ax-btn:hover { border-color: var(--accent); }
.ax-btn:disabled { opacity: .5; cursor: default; }
.ax-btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.ax-btn.danger { color: var(--danger); }
.ax-btn.ghost { background: transparent; border-color: transparent; }
.ax-btn.ghost:hover { background: var(--bg); border-color: transparent; }
.ax-btn.small { padding: 4px 8px; font-size: 12.5px; }
.ax-btn.block { display: block; width: 100%; text-align: center; }
.ax-btn:focus-visible, .ax-input:focus-visible, .ax-tab:focus-visible, .ax-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ax-input, .ax-textarea { font: inherit; color: var(--fg); background: var(--field); border: 1px solid var(--line-strong, var(--line)); border-radius: 8px; padding: 7px 9px; width: 100%; }
.ax-textarea { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; min-height: 96px; }
.ax-label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.ax-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ax-stack { display: flex; flex-direction: column; gap: 10px; }
.ax-muted { color: var(--muted); font-size: 12.5px; margin: 0; }
.ax-h { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.ax-chip { font: inherit; font-size: 12.5px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.ax-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.ax-card { border: 1px solid var(--line); border-radius: 10px; background: var(--field); padding: 10px 12px; }
.ax-badge { display: inline-block; font-size: 11px; border-radius: 999px; padding: 1px 7px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.ax-badge.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.ax-badge.bad { background: var(--danger); color: var(--panel); border-color: transparent; }
.ax-badge.ok { color: var(--accent); border-color: var(--accent); background: transparent; }
.ax-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

/* Side panel with tabs */
body.ax .panel { padding-block: 0 16px; gap: 0; flex-basis: 356px; }
:root { --line-strong: #88948d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --line-strong: #71807a; } }
:root[data-theme="dark"] { --line-strong: #71807a; }
:root[data-theme="light"] { --line-strong: #88948d; }
body.ax label.f { font-size: 12px; gap: 4px; }
body.ax label.f input, body.ax label.f select { border-radius: 8px; padding: 7px 9px; border-color: var(--line-strong); }
body.ax button.act { border-radius: 8px; padding: 7px 12px; }
.ax-tabs { flex: 0 0 auto; position: sticky; top: 0; z-index: 2; display: flex; gap: 2px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); margin: 0 -16px 14px; padding: 6px 8px 0; gap: 0; scrollbar-width: none; }
.ax-tabs::-webkit-scrollbar { display: none; }
.ax-tab { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 8px 6px; cursor: pointer; white-space: nowrap; }
.ax-tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
.ax-tab .ax-dot { display: inline-block; min-width: 16px; margin-left: 5px; padding: 0 5px; border-radius: 999px; font-size: 10.5px; line-height: 16px; text-align: center; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.ax-tab .ax-dot.warn { background: var(--danger); color: var(--panel); }
.ax-tab .ax-dot[hidden] { display: none; }
.ax-pane { flex: 0 0 auto; display: flex; flex-direction: column; gap: 18px; }
.ax-pane[hidden] { display: none; }

/* Floating view controls */
.ax-nav { position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.ax-nav[hidden] { display: none; }
.ax-nav .ax-navgrp { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
.ax-nav button { width: 38px; height: 36px; border: 0; background: transparent; color: var(--fg); font: 600 17px/1 var(--font-body); cursor: pointer; }
.ax-nav button + button { border-top: 1px solid var(--line); }
.ax-nav button:hover { background: var(--bg); }
.ax-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
body.ax #segQuality { display: none; }
body.ax .hint:not(.rvstatus) { right: 64px; max-width: none; width: fit-content; }

/* Menu (dropdown), modal, toast */
.ax-menu { position: fixed; z-index: 40; min-width: 240px; max-width: min(340px, calc(100vw - 16px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .18); padding: 6px; }
.ax-menu .ax-item { display: flex; width: 100%; align-items: center; gap: 8px; font: inherit; color: var(--fg); background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer; text-align: left; }
.ax-menu .ax-item:hover, .ax-menu .ax-item:focus-visible { background: var(--bg); outline: none; }
.ax-menu .ax-item.danger { color: var(--danger); }
.ax-menu .ax-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.ax-menu .ax-head { padding: 8px 10px 6px; }
.ax-avatar { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--accent); color: var(--accent-fg); font: 600 14px/1 var(--font-body); cursor: pointer; flex: 0 0 auto; }
.ax-scrim { position: fixed; inset: 0; z-index: 45; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 20, 17, .45); }
.ax-modal { width: 100%; max-width: 560px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.ax-modal.wide { max-width: 760px; }
.ax-modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; }
.ax-modal-head h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--fg); margin: 0; flex: 1; }
.ax-modal-body { padding: 14px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.ax-modal-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 0 18px 16px; }
.ax-toasts { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.ax-toast { background: var(--fg); color: var(--panel); border-radius: 10px; padding: 9px 14px; font-size: 13px; max-width: min(520px, calc(100vw - 32px)); box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
.ax-steps { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; }
.ax-steps b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
.ax-steps b.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.ax-drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); background: var(--field); }
.ax-drop.over { border-color: var(--accent); color: var(--fg); }
@media (max-width: 760px) {
  .ax-brand { display: none; }
  .ax-status { display: none; }
  .ax-bar { gap: 8px; height: 48px; }
  .ax-tabs { margin-inline: -16px; }
  .ax-nav { right: 10px; bottom: 10px; }
  .ax-modal { max-height: calc(100vh - 16px); max-height: calc(100dvh - 16px); }
  .ax-input, .ax-textarea, .ax-flat select, label.f input, label.f select { font-size: 16px; }   /* below 16 px iOS zooms the page on focus */
  .ax-nav .ax-orbit { display: none !important; }
  .ax-nav { flex-direction: row; }
  body.ax #segWalls { display: none; }
  body.ax .panel { flex-basis: 48%; }
  .ax-scrim { padding: 8px; align-items: flex-end; }
}
@media (prefers-reduced-motion: no-preference) {
  .ax-toast { animation: ax-in .18s ease-out; }

}
@media (pointer: coarse) {
  .ax-btn, .ax-chip, .ax-tab, .seg button, button.act, .ax-menu .ax-item { min-height: 44px; }
  .ax-nav button, .ax-avatar { width: 44px; height: 44px; }
}
.ax-badge { font-size: 12px; }

/* Account menu and its dialogs (stand-alone app only). Prefix axa-. */
.axa-bar { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.axa-bar[hidden], .axa-share-btn[hidden], .axa-avatar[hidden] { display: none; }
.axa-share-btn { white-space: nowrap; }
.axa-name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; margin: 0; }
.axa-flat { display: flex; flex-direction: column; gap: 8px; }
.axa-flat-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }

.axa-share .axa-name { flex: 1 1 160px; font-weight: 400; }
.axa-choice { gap: 6px; }
.axa-err { margin: 0; color: var(--danger); font-size: 13px; }
.axa-err[hidden] { display: none; }
.axa-act { display: flex; flex-direction: column; align-items: flex-start; }
.axa-done { margin: 8px 0 6px; font-size: 13px; overflow-wrap: anywhere; }
.axa-done:empty { margin: 0; }
.axa-copy[hidden] { display: none; }
.axa-help { margin: 0; display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 8px 14px; }
.axa-help dt { font-weight: 600; }

@media (max-width: 480px) {
  .axa-help { grid-template-columns: 1fr; gap: 2px; }
  .axa-help dd { margin-bottom: 8px; }
  .axa-share-btn { padding-inline: 8px; }
}

/* Onboarding wizard (add a flat). Every class is prefixed axo-; colours come from the page's tokens. */
.axo-steps { flex-wrap: wrap; row-gap: 4px; }
.axo-steps span { margin-right: 6px; }
.axo-steps .axo-on { color: var(--fg); font-weight: 600; }
.axo-lead { margin: 0; font-size: 14px; }
.axo-title { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.axo-choice { display: flex; flex-direction: column; gap: 3px; width: 100%; font: inherit; color: var(--fg); text-align: left; cursor: pointer; }
.axo-choice:hover { border-color: var(--accent); }
.axo-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.axo-todo { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 12px; }
.axo-todo li > * { display: block; }
.axo-todo li > span + * { margin-top: 6px; }
.axo-todo li > .ax-row { display: flex; gap: 14px; }
.axo-todo li > [hidden] { display: none; }
.axo-link { color: var(--accent); font-weight: 600; }
.axo-prompt { min-height: 120px; }
.axo-tip { margin: 0; font-size: 12.5px; background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.axo-drop { display: flex; flex-direction: column; align-items: center; gap: 8px; overflow-wrap: anywhere; }
.axo-paste { min-height: 130px; }
.axo-err { margin: 0; color: var(--danger); font-size: 13px; }
.axo-err[hidden] { display: none; }
.axo-check { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.axo-preview { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 6px; }
.axo-svg { display: block; width: 100%; height: auto; max-height: 52vh; }
.axo-room { stroke: var(--line); stroke-width: 1; fill: var(--field); }
.axo-room.axo-parquet { fill: var(--warn-bg); }
.axo-room.axo-tile { fill: var(--panel); }
.axo-room.axo-balcony { fill: var(--bg); stroke: var(--muted); stroke-dasharray: 4 3; }
.axo-wall { stroke: var(--fg); stroke-linecap: butt; }
.axo-glass { stroke: var(--accent); opacity: .55; }
.axo-bar { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.axo-name { fill: var(--fg); font: 10.5px var(--font-body); paint-order: stroke; stroke: var(--bg); stroke-width: 2.5px; stroke-linejoin: round; }
.axo-area { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.axo-area > span:first-child { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.axo-area b { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.axo-total { border-top: 1px solid var(--line); padding-top: 8px; }
@media (max-width: 480px) { .axo-steps span:not(.axo-on) { display: none; } }
@media (max-width: 640px) {
  .axo-check { grid-template-columns: minmax(0, 1fr); }
  .axo-svg { max-height: 40vh; }
}

/* Furniture catalogue (stand-alone app). Every class is prefixed axc-. */
.axc { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.axc-chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px; scrollbar-width: thin; }
.axc-chips .ax-chip { flex: 0 0 auto; }
.axc-count { min-height: 1.3em; }
.axc-list, .axc-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.axc-list { gap: 4px; }
.axc-list > .axc-group { margin-top: 10px; }

  const center = new THREE.Vector3();

  // Sun, sky and shadow frustum follow the apartment (walls low or high, balcony included) plus the furniture,
  // so tall or far-out pieces still cast complete shadows. Only re-fits when the box actually changed.
  function syncLights(force) {
    Realism.invalidateShadows(); // every geometry/furniture change passes through here: redraw + new shadow map
    if (RV.on && !RB) RV.changed(); // the Rendering view rebuilds its own copy of the scene
    if (!aptBounds) return;
    const b = Object.assign({}, aptBounds);
    cur.items.forEach(it => {
      const r = Math.hypot(it.w, it.d) / 2 + 0.05;
      b.minX = Math.min(b.minX, it.x - r); b.maxX = Math.max(b.maxX, it.x + r);

      b.height = Math.max(b.height, it.h + (it.type === 'bed' ? 0.5 : 0));

    const key = [b.minX, b.maxX, b.minZ, b.maxZ, b.height].map(v => v.toFixed(2)).join('|');
    if (!force && key === litKey) return;
    litKey = key;

    groundShadow.position.set((b.minX + b.maxX) / 2, -0.045, (b.minZ + b.maxZ) / 2);

  // Corner sofa with longchair. side = left/right as seen standing in front of the sofa (left = -x).
  function buildLSofa(g, it) {
    const w = it.w, d = it.d, h = it.h;
    const clamp = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };
    const num = function (v, def) { return (typeof v === 'number' && isFinite(v) && v > 0) ? v : def; };
  
    // davorstehend left = -x, right = +x (see header)
    const sx = (it.side === 'right') ? 1 : -1;
  
    // ---- parameters with defaults, clamped so everything stays inside w x d x h ----
    const legH    = clamp(num(it.legH, Math.min(0.02, h * 0.1)), 0.005, h * 0.3);
    const seatH   = clamp(num(it.seatH, Math.min(0.38, h * 0.55)), legH + 0.06, h * 0.8);
    const armW    = clamp(num(it.armW, Math.min(0.24, w * 0.1)), 0.04, w * 0.2);
    const armH    = clamp(num(it.armH, Math.min(0.60, h * 0.85)), seatH, h);
    const chaiseW = clamp(num(it.chaiseW, w * 0.38), armW + 0.3, w - armW - 0.3);
    const mainD   = clamp(num(it.mainD, Math.min(1.02, d * 0.6)), d * 0.3, d);
    const backT   = Math.min(0.15, mainD * 0.16);          // backrest frame thickness
    const backCT  = Math.min(0.22, mainD * 0.22);          // back cushion thickness
    const cushT   = Math.min(0.14, (seatH - legH) * 0.45); // seat cushion thickness
    const gap     = 0.008;                                 // visual gap between cushions
  
    // ---- materials ----
    const m = M(it.color, 'fabric');
    const lighter = new THREE.Color(it.color).lerp(new THREE.Color(0xffffff), 0.14);
    const mc = M('#' + lighter.getHexString(), 'fabric');  // cushions: slightly lighter
    const ml = M(it.legColor !== undefined ? it.legColor : 0x1a1a1a, 'metal');
  
    // ---- key coordinates ----
    const zBack   = -d / 2;                // back face
    const zMain   = zBack + mainD;         // front edge of the main (non-chaise) seat
    const zFront  = d / 2;                 // front edge of the longchair
    const zSeat0  = zBack + backT;         // where the base starts behind the cushions
    const zCush0  = zSeat0 + backCT;       // front face of the back cushions
    const xIn     = w / 2 - armW;          // inner face of the armrests (+/-)
    const baseTop = seatH - cushT;
    const baseH   = baseTop - legH;
    const baseY   = legH + baseH / 2;
  
    // x-extent of the chaise seat column (inside its armrest) and of the remaining main seat
    const chW  = chaiseW - armW;                       // chaise seat width
    const chX  = sx * (xIn - chW / 2);                 // chaise seat centre x
    const mnW  = 2 * xIn - chW;                        // main seat width (rest of the sofa)
    const mnX  = -sx * (xIn - mnW / 2);                // main seat centre x
  
    // ---- base / frame ----
    box(g, 2 * xIn, baseH, zMain - zSeat0, 0, baseY, (zSeat0 + zMain) / 2, m);      // main base
    if (zFront > zMain) {
      box(g, chW, baseH, zFront - zMain, chX, baseY, (zMain + zFront) / 2, m);      // longchair base
    }
  
    // ---- backrest frame along the whole back ----
    const backFrameH = (h - 0.04) - legH;
    box(g, w, backFrameH, backT, 0, legH + backFrameH / 2, zBack + backT / 2, m);
  
    // ---- armrests (both only as deep as the main part; the longchair runs out past its armrest) ----
    const armLen = mainD - backT;
    const armZ   = (zSeat0 + zMain) / 2;
    const armHt  = armH - legH;
    box(g, armW, armHt, armLen, -(w / 2 - armW / 2), legH + armHt / 2, armZ, m);
    box(g, armW, armHt, armLen,  (w / 2 - armW / 2), legH + armHt / 2, armZ, m);
  
    // ---- seat cushions ----
    const cushY = baseTop + cushT / 2;
    const nSeats = Math.max(1, Math.round(num(it.seats, mnW / 0.8)));
    const segW = mnW / nSeats;
    const mainSeatD = zMain - zCush0;
    for (let i = 0; i < nSeats; i++) {
      const cx = mnX - mnW / 2 + segW * (i + 0.5);
      box(g, segW - gap, cushT, mainSeatD - gap, cx, cushY, zCush0 + mainSeatD / 2, mc);
    }
    const chSeatD = zFront - zCush0;                                                 // one long cushion
    box(g, chW - gap, cushT, chSeatD - gap, chX, cushY, zCush0 + chSeatD / 2, mc);
  
    // ---- back cushions (lean against the backrest, top flush with h) ----
    const bcH = h - seatH;
    const bcY = seatH + bcH / 2;
    const bcZ = zSeat0 + backCT / 2;
    for (let i = 0; i < nSeats; i++) {
      const cx = mnX - mnW / 2 + segW * (i + 0.5);
      box(g, segW - gap, bcH, backCT, cx, bcY, bcZ, mc);
    }
    box(g, chW - gap, bcH, backCT, chX, bcY, bcZ, mc);
  
    // ---- legs / gliders ----
    const ls = Math.min(0.06, armW);          // leg footprint
    const li = ls / 2 + 0.02;                 // inset of leg centre from the edges
    const legAt = function (x, z) { box(g, ls, legH, ls, x, legH / 2, z, ml); };
    legAt(-(w / 2 - li), zBack + li);
    legAt( (w / 2 - li), zBack + li);
    legAt(-(w / 2 - li), zMain - li);
    legAt( (w / 2 - li), zMain - li);
    legAt(0, zBack + li);
    legAt(mnX, zMain - li);
    if (zFront - zMain > 2 * li) {
      legAt(chX - (chW / 2 - li), zFront - li);
      legAt(chX + (chW / 2 - li), zFront - li);
    }
    return g;
  }

  // Furniture from a real 3D model file published next to the page (e.g. the retailer's own GLB).
  // The model is fitted into the item's w x d x h box; until it has loaded, a box-built stand-in is shown.
  const glbCache = {};
  function buildGlb(g, it) {

      const fit = new THREE.Group();
      fit.scale.set((it.side === 'right' ? -1 : 1) * it.w / s.x, it.h / s.y, it.d / s.z);
      o.position.set(-c.mid.x, -c.minY, -c.mid.z);

      turn.remove(gltf.scene);
      const b0 = new THREE.Box3().setFromObject(gltf.scene);
      c.mid = b0.getCenter(new THREE.Vector3()); c.minY = b0.min.y;
      gltf.scene.traverse(n => { n.userData.shared = true; });
      c.scene = gltf.scene; c.state = 'ready';
      cur.items.filter(i => i.type === 'glb' && i.src === it.src).forEach(refreshItem);
    }, undefined, () => { c.state = 'failed'; });
  }

  // Rounded chair shell with wall thickness: wraps about 230 degrees around the back (back at -z), the top edge
  // runs from the full height at the back down to armrest height at the open front ends.
  function chairShell(g, w, d, h, y0, armH, mat) {
    const A = 2.0, na = 28, ny = 7, tk = 0.11, pos = [], idx = [];
    const topY = a => armH + (h - armH) * Math.pow(Math.max(0, Math.cos(a * 0.82)), 1.6);
    const pt = (a, t, inner) => {
      const R = (0.84 + 0.16 * Math.sin(t * Math.PI / 2)) * (inner ? 1 - tk : 1), y = y0 + (topY(a) - y0) * t;
      pos.push(Math.sin(a) * R * w / 2, y, -Math.cos(a) * R * d / 2);
    };
    for (let k = 0; k < 2; k++) for (let i = 0; i <= na; i++) for (let j = 0; j <= ny; j++) pt(-A + 2 * A * i / na, j / ny, k === 1);
    const id = (k, i, j) => k * (na + 1) * (ny + 1) + i * (ny + 1) + j;
    const q = (a, b, c, e) => idx.push(a, b, c, a, c, e);
    for (let i = 0; i < na; i++) for (let j = 0; j < ny; j++) {
      q(id(0, i, j), id(0, i, j + 1), id(0, i + 1, j + 1), id(0, i + 1, j));   // outside
      q(id(1, i, j), id(1, i + 1, j), id(1, i + 1, j + 1), id(1, i, j + 1));   // inside
    }
    for (let i = 0; i < na; i++) {
      q(id(0, i, ny), id(1, i, ny), id(1, i + 1, ny), id(0, i + 1, ny));       // top rim
      q(id(0, i, 0), id(0, i + 1, 0), id(1, i + 1, 0), id(1, i, 0));           // bottom rim
    }
    for (let j = 0; j < ny; j++) {
      q(id(0, 0, j), id(1, 0, j), id(1, 0, j + 1), id(0, 0, j + 1));           // front end caps
      q(id(0, na, j), id(0, na, j + 1), id(1, na, j + 1), id(1, na, j));
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(new Array(pos.length / 3 * 2).fill(0.5), 2));
    geo.setIndex(idx); geo.computeVertexNormals();

  }
  // Round tapered bar between two points (table and chair legs)
  function strut(g, a, b, rTop, rBot, mat) {
    const va = new THREE.Vector3().fromArray(a), vb = new THREE.Vector3().fromArray(b), dir = va.clone().sub(vb);
    const me = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, dir.length(), 14), mat);
    me.position.copy(va).add(vb).multiplyScalar(0.5);
    me.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    g.add(me); return me;

  // Upholstered stool: soft block on small gliders, top cushion slightly inset
  function buildPouf(g, it) {
    const w = it.w, d = it.d, h = it.h, m = M(it.color, 'fabric'), lg = Math.min(0.025, h * 0.2);
    box(g, w, h - lg - 0.05, d, 0, lg + (h - lg - 0.05) / 2, 0, m);
    box(g, w - 0.03, 0.05, d - 0.03, 0, h - 0.025, 0, m);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(q => box(g, 0.05, lg, 0.05, q[0] * (w / 2 - 0.08), lg / 2, q[1] * (d / 2 - 0.08), M(0x1a1a1a, 'metal')));

  // Box with rounded edges (soft upholstery); falls back to a plain box if the geometry script did not load.
  function rbox(g, w, h, d, x, y, z, mat, r) {

    Realism.clothUV(geo, mat, w, h, d);

  }
  // Rounded "pebble" corner sofa (home24 Ovo): low soft base with a longchair, a low back and arm roll,
  // two large loose back cushions and two small pillows. side = left/right as seen standing in front (left = -x).
  function buildOvo(g, it) {
    const w = it.w, d = it.d, h = it.h, m = M(it.color, 'struct');   // Strukturstoff Purna: nubby cream cloth with a fine salt-and-pepper grain
    const sx = it.side === 'right' ? 1 : -1, sh = Math.min(it.seatH || 0.43, h * 0.6), aw = Math.min(it.armW || 0.22, w * 0.15);
    const ah = Math.min(it.armH || 0.65, h - 0.05), md = Math.min(it.mainD || 0.83, d), cw = Math.min(it.chaiseW || 1.16, w * 0.6);
    const zb = -d / 2, lg = 0.03, bt = 0.18;
    const mainW = w - cw, mainX = -sx * (w / 2 - mainW / 2), chX = sx * (w / 2 - cw / 2);
    rbox(g, mainW + 0.06, sh - lg, md, mainX - sx * 0.03, lg + (sh - lg) / 2, zb + md / 2, m, 0.13);      // main seat block
    rbox(g, cw, sh - lg, d, chX, lg + (sh - lg) / 2, 0, m, 0.15);                                           // longchair
    rbox(g, w - 0.04, ah - 0.22, bt, 0, 0.22 + (ah - 0.22) / 2, zb + bt / 2, m, 0.11);                      // low back roll
    rbox(g, aw, ah - 0.12, md - 0.05, -sx * (w / 2 - aw / 2), 0.12 + (ah - 0.12) / 2, zb + (md - 0.05) / 2, m, 0.1); // arm at the open end
    rbox(g, aw, ah - 0.12, md - 0.05, sx * (w / 2 - aw / 2), 0.12 + (ah - 0.12) / 2, zb + (md - 0.05) / 2, m, 0.1); // arm beside the longchair, as deep as the main body
    const inner = w - 2 * aw, cwid = inner / 2 - 0.02, ch = h - sh;
    [-1, 1].forEach(q => { const c = rbox(g, cwid, ch, 0.24, q * (cwid / 2 + 0.01), sh + ch / 2 - 0.02, zb + bt + 0.13, m, 0.11); c.rotation.x = -0.16; });
    [-1, 1].forEach(q => { const p = rbox(g, 0.36, 0.36, 0.13, q * (inner / 2 - 0.2), sh + 0.19, zb + bt + 0.36, m, 0.06); p.rotation.x = -0.35; p.rotation.y = -q * 0.3; });
    if (it.accents !== false) {   // accent cushions: terracotta and sage from the room's palette, one in a brown melange
      const terra = M('#b5633c', 'fabric'), sage = M('#8d9a78', 'fabric'), mel = boucleMat('#8c6f5a');
      [[-1, 0.52, 0.45, terra, 0.12], [-1, 0.9, 0.4, mel, -0.1], [1, 0.52, 0.45, sage, -0.12], [1, 0.92, 0.5, terra, 0.08]].forEach((c, i) => {
        const lum = i === 3, p = rbox(g, c[2], lum ? 0.3 : c[2], 0.13, c[0] * (inner / 2 - c[1]), sh + (lum ? 0.16 : c[2] / 2 + 0.01), zb + bt + 0.33 + (i % 2) * 0.05, c[3], 0.06);
        p.rotation.x = -0.32; p.rotation.y = c[4];
      });
    }

    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(q => box(g, 0.05, lg, 0.05, q[0] * (w / 2 - 0.15), lg / 2, q[1] > 0 ? (q[0] === sx ? d / 2 - 0.15 : zb + md - 0.15) : zb + 0.15, foot));
  }

  // Upholstered bed home24 "Mattis" (maker's sketch: 180 x 218 x 105 cm for the 160 x 200 mattress): a 10 cm
  // padded frame with its top edge at 50 cm, a flat headboard with rounded corners, and four splayed, tapered
  // oak legs of 19 cm. Headboard at -z. Sizes scale with the item box.
  function buildMattis(g, it) {
    const w = it.w, d = it.d, h = it.h, m = M(it.color, 'fabric'), oak = M(0xc9a36b, 'wood');
    const kx = 1, kz = d / 2.18, ky = h / 1.05;
    const lg = 0.19 * ky, ft = 0.50 * ky, rt = 0.10 * kx, hd = 0.09 * kz, fr = 0.10 * kz, zb = -d / 2;
    const fh = ft - lg, yc = lg + fh / 2, zs = zb + hd - 0.02, sl = d / 2 - zs;
    [-1, 1].forEach(q => rbox(g, rt, fh, sl, q * (w / 2 - rt / 2), yc, zs + sl / 2, m, 0.035));       // side rails
    rbox(g, w, fh, fr, 0, yc, d / 2 - fr / 2, m, 0.035);                                              // foot rail
    rbox(g, w - 0.04, fh, hd * 0.6, 0, yc, zb + hd * 0.6, m, 0.02);                                   // head rail behind the mattress
    // headboard: rounded-rectangle slab, 86 cm high, softly bevelled
    const hh = h - lg, r = Math.min(0.09, hh / 3), bv = 0.022, x0 = -w / 2 + bv, x1 = w / 2 - bv, y0 = bv, y1 = hh - bv;
    const sp = new THREE.Shape();
    sp.moveTo(x0 + r, y0); sp.lineTo(x1 - r, y0); sp.quadraticCurveTo(x1, y0, x1, y0 + r); sp.lineTo(x1, y1 - r);
    sp.quadraticCurveTo(x1, y1, x1 - r, y1); sp.lineTo(x0 + r, y1); sp.quadraticCurveTo(x0, y1, x0, y1 - r); sp.lineTo(x0, y0 + r); sp.quadraticCurveTo(x0, y0, x0 + r, y0);
    const hg = new THREE.ExtrudeGeometry(sp, { depth: hd - 2 * bv, bevelEnabled: true, bevelThickness: bv, bevelSize: bv, bevelSegments: 4, curveSegments: 10 });
    const hb = new THREE.Mesh(hg, m); hb.position.set(0, lg, zb + bv); g.add(hb);
    // slatted base (dark recess), mattress, duvet and pillows
    const mw = w - 2 * rt, ml = d - hd - fr, zm = zb + hd + ml / 2;
    box(g, mw, 0.03, ml, 0, ft - 0.15 * ky, zm, M(0x2a2a2a, 'wall'));
    const white = M(0xfbfaf7, 'fabric'), linen = M(0xd9d4ca, 'fabric');
    rbox(g, mw - 0.01, 0.21 * ky, ml - 0.01, 0, ft - 0.135 * ky + 0.105 * ky, zm, white, 0.04);        // mattress, top 7 cm above the frame
    const mt = ft + 0.075 * ky;
    rbox(g, mw + 0.02, 0.07, ml * 0.68, 0, mt + 0.02, zm + ml * 0.16, linen, 0.03);                    // duvet
    rbox(g, mw + 0.02, 0.075, 0.22, 0, mt + 0.025, zm - ml * 0.18, white, 0.035);                       // folded-back edge
    [-1, 1].forEach(q => { const p = rbox(g, mw * 0.44, 0.13, 0.42, q * mw * 0.245, mt + 0.075, zb + hd + 0.27, white, 0.06); p.rotation.x = -0.22; });
    // oak legs: 19 cm, tapered, splayed outward along the diagonal
    [-1, 1].forEach(qx => [-1, 1].forEach(qz => {
      const tx = qx * (w / 2 - 0.13), tz = qz > 0 ? d / 2 - 0.13 : zb + 0.16;

    }));
  }

  // Boucle upholstery: the fabric material with a speckled, nubbly colour and bump texture of its own
  const boucleCache = {};
  function boucleMat(color, soft) {
    return M(color, soft ? 'fabric' : 'boucle');   // photographed cloth from the render layer: woven linen or nubbly wool

  // signed link of a picture, kept for the session (renewed before it runs out)

    var c = urls[img.id];
    if (c && Date.now() - c.t < URL_AGE) return Promise.resolve(c.url);
    return call(function () { return A.images.url(img); }).then(function (u) { urls[img.id] = { url: u, t: Date.now() }; return u; });
  }
  // Puts the picture into an <img>. It is asked for with crossOrigin so its pixels can be read later; if the
  // server refuses that, it is loaded again the plain way (st.cors then says false).
  function show(pic, img, st) {
    st = st || {}; st.cors = true; st.failed = false;
    return url(img).then(function (u) {
      pic.onerror = function () {
        if (st.cors) { st.cors = false; pic.removeAttribute('crossorigin'); pic.src = u; return; }
        pic.onerror = null; st.failed = true; delete urls[img.id]; pic.alt = 'Bild konnte nicht geladen werden';
      };
      pic.crossOrigin = 'anonymous'; pic.src = u;
    }, function () { st.failed = true; pic.alt = 'Bild konnte nicht geladen werden'; });
  }

  function render() {
    var add = canAdd(), isFull = list.length >= MAX, why = '';
    if (cur.lv === 'demo') why = T.demo; else if (!cur.user) why = T.signedOut; else if (!add) why = T.view;
    reason.textContent = why; reason.hidden = !why;
    bar.hidden = !add || !list.length;
    addBtn.disabled = isFull || busy; addBtn2.disabled = busy;
    count.textContent = isFull ? T.full : list.length + ' von ' + MAX;
    var noPics = loaded && !loadErr && !list.length && cur.lv !== 'demo' && cur.user;
    empty.hidden = !noPics; empty.classList.toggle('axd-ro', !add);
    emptyText.textContent = add ? T.empty : T.emptyRo; addBtn2.hidden = !add;
    var s = cur.id + '\n' + list.map(function (i) { return i.id + '\t' + i.note; }).join('\n');
    if (s === sig) return;
    sig = s; grid.textContent = ''; grid.hidden = !list.length;
    list.forEach(function (img) {
      var li = el('li', 'axd-cell'), b = el('button', 'axd-thumb'), pic = el('img');
      b.type = 'button'; b.setAttribute('aria-label', img.note ? 'Bild öffnen: ' + img.note : 'Bild öffnen');
      pic.alt = ''; pic.decoding = 'async'; pic.loading = 'lazy'; show(pic, img);
      b.appendChild(pic); b.addEventListener('click', function () { openDetail(img); });
      var cap = el('div', 'axd-cap', img.note || ''); if (img.note) cap.title = img.note;
      li.appendChild(b); li.appendChild(cap); grid.appendChild(li);
    });
  }

  function load() {
    var s = cur, t = ++token;
    if (!s.user || s.lv === 'demo' || !s.id) { list = []; loaded = true; loadErr = false; setMsg(''); render(); return; }
    if (!loaded) setMsg('Bilder werden geladen …');
    call(function () { return A.images.list(s.id); }).then(function (rows) {
      if (t !== token) return;
      list = (rows || []).slice().reverse(); loaded = true; loadErr = false; setMsg(''); render();       // the list comes oldest first
    }, function (e) {
      if (t !== token) return;
      loaded = true; loadErr = !list.length; setMsg(errText(e, 'Die Bilder konnten nicht geladen werden.')); render();
    });
  }
  // called on 'flat' and 'account' (reloads only when the flat or the person's rights changed) and when the tab opens
  function sync(force) {
    var s = readState(), key = s.id + '|' + s.lv + '|' + (s.user ? 1 : 0), changed = key !== curKey;
    if (!changed && !force) return;
    if (changed) { curKey = key; cur = s; list = []; loaded = false; loadErr = false; token++; if (!busy) prog.textContent = ''; setMsg(''); render(); }
    if (!pane.hidden) load();
  }

  // ---- Scaling down in the browser: longest side 1600 px, JPEG from quality 0.82 downwards, then smaller
  function decode(f) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(f), im = new Image();
      im.onload = function () { res({ im: im, done: function () { URL.revokeObjectURL(u); } }); };
      im.onerror = function () { URL.revokeObjectURL(u); rej(new Error(T.unreadable)); };
      im.src = u;
    });
  }
  function encode(im, w, h, q) {
    return new Promise(function (res, rej) {
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      var g = c.getContext('2d'); if (!g) { rej(new Error(T.unreadable)); return; }
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0, w, h);      // white behind transparent pictures
      c.toBlob(function (b) { c.width = c.height = 0; if (b) res(b); else rej(new Error(T.unreadable)); }, 'image/jpeg', q);
    });
  }
  function shrink(f) {
    return decode(f).then(function (d) {
      var W = d.im.naturalWidth, H = d.im.naturalHeight, k, q = 0.82;
      if (!W || !H) { d.done(); throw new Error(T.unreadable); }
      k = Math.min(1, SIDE / Math.max(W, H));
      function step() {
        return encode(d.im, Math.max(1, Math.round(W * k)), Math.max(1, Math.round(H * k)), q).then(function (b) {
          if (b.size < LIMIT) return b;
          if (q > 0.5) q = Math.round((q - 0.1) * 100) / 100;
          else { k *= 0.8; if (Math.max(W, H) * k < 240) throw new Error(T.tooBig); }
          return step();
        });
      }
      return step().then(function (b) { d.done(); return b; }, function (e) { d.done(); throw e; });
    });
  }

  // ---- Adding pictures (file picker, drop, paste), one after the other with a line of progress each
  function isImage(f) { return !!f && (/^image\//i.test(f.type || '') || (!f.type && /\.(jpe?g|png|webp|gif|avif|bmp|heic|heif)$/i.test(f.name || ''))); }
  function addFiles(files) {
    var all = Array.prototype.slice.call(files || []), pics = all.filter(isImage);
    if (!all.length) return;
    if (!canAdd()) { UI.toast(cur.lv === 'demo' ? T.demo : cur.user ? T.view : T.signedOut, 5000); return; }
    if (!pics.length) { UI.toast('Das sind keine Bilder. Möglich sind zum Beispiel JPEG, PNG oder WebP.', 4500); return; }
    if (busy) { UI.toast('Warte kurz, bis die laufenden Bilder hochgeladen sind.'); return; }
    if (!loaded || loadErr) { UI.toast(loadErr ? 'Die Bilder dieser Wohnung konnten nicht geladen werden. Öffne den Reiter nochmals und versuch es dann wieder.' : 'Die Bilder werden noch geladen. Versuch es gleich nochmals.', 5000); return; }
    var room = MAX - list.length, note = '';
    if (room <= 0) { UI.toast(T.full, 5000); return; }
    if (pics.length > room) { note = 'Es ' + (room === 1 ? 'hat nur noch 1 Bild' : 'haben nur noch ' + room + ' Bilder') + ' Platz (höchstens ' + MAX + ' pro Wohnung). Die übrigen wurden weggelassen.'; pics = pics.slice(0, room); }
    var flatId = cur.id, done = 0, rows;
    busy = true; prog.textContent = ''; setMsg(note); render();
    rows = pics.map(function (f, i) {
      var li = el('li', 'axd-row'), name = el('span', 'axd-name', f.name || 'Bild ' + (i + 1)), st = el('span', 'axd-state', 'wartet');
      li.appendChild(name); li.appendChild(st); prog.appendChild(li);
      return { li: li, st: st };
    });
    function one(i) {
      if (i >= pics.length) return finish();
      var r = rows[i];
      r.st.textContent = 'wird verkleinert …';
      return shrink(pics[i]).then(function (blob) {
        r.st.textContent = 'wird hochgeladen …';
        return A.images.add(flatId, blob, { note: '', link: '' });
      }).then(function (img) {
        done++; r.li.remove();
        if (img && cur.id === flatId && !list.some(function (x) { return x.id === img.id; })) { list.unshift(img); render(); }
      }, function (e) {
        r.li.classList.add('axd-bad'); r.st.textContent = errText(e, 'Das Bild konnte nicht hinzugefügt werden.');
      }).then(function () { return one(i + 1); });
    }
    function finish() {
      busy = false; render();
      if (done) UI.toast(done === 1 ? '1 Bild hinzugefügt.' : done + ' Bilder hinzugefügt.');
    }
    one(0);
  }
  file.addEventListener('change', function () { addFiles(file.files); });
  function hasFiles(e) { var t = e.dataTransfer && e.dataTransfer.types; return !!t && Array.prototype.indexOf.call(t, 'Files') >= 0; }
  var over = 0;
  pane.addEventListener('dragenter', function (e) { if (!hasFiles(e)) return; e.preventDefault(); over++; root.classList.add('axd-over'); });
  pane.addEventListener('dragover', function (e) { if (!hasFiles(e)) return; e.preventDefault(); try { e.dataTransfer.dropEffect = canAdd() ? 'copy' : 'none'; } catch (x) {} });
  pane.addEventListener('dragleave', function (e) { if (!hasFiles(e)) return; over = Math.max(0, over - 1); if (!over) root.classList.remove('axd-over'); });
  pane.addEventListener('drop', function (e) { if (!hasFiles(e)) return; e.preventDefault(); over = 0; root.classList.remove('axd-over'); addFiles(e.dataTransfer.files); });
  document.addEventListener('paste', function (e) {
    try {
      if (UI.currentTab() !== 'ideas' || pane.hidden || document.querySelector('.ax-scrim, .axp-overlay')) return;
      var cd = e.clipboardData, items = cd && cd.items, files = [], i, f;
      for (i = 0; items && i < items.length; i++) if (items[i].kind === 'file' && /^image\//i.test(items[i].type)) { f = items[i].getAsFile(); if (f) files.push(f); }
      if (!files.length) return;
      e.preventDefault(); addFiles(files);
    } catch (x) {}
  });

  // ---- Detail dialog: picture, note and link, removing, and "Möbel daraus nachbauen"
  function cleanLink(v) {      // '' | a http(s) address | null when it is something else
    var s = String(v || '').trim(), u;
    if (!s) return '';
    if (/^[a-z0-9-]+(\.[a-z0-9-]+)+([\/?#]\S*)?$/i.test(s)) s = 'https://' + s;
    if (s.length > 500 || !/^https?:\/\/\S+$/i.test(s)) return null;
    try { u = new URL(s); } catch (e) { return null; }
    return u.protocol === 'http:' || u.protocol === 'https:' ? s : null;
  }
  function field(label, input) { var l = el('label', 'ax-label'); l.appendChild(el('span', '', label)); l.appendChild(input); return l; }
  function hex(n) { var s = Math.max(0, Math.min(255, Math.round(n))).toString(16); return s.length < 2 ? '0' + s : s; }
  function cm(m) { return typeof m === 'number' && isFinite(m) && m > 0 ? String(Math.round(m * 1000) / 10) : ''; }
  function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : NaN; }

  function openDetail(img) {
    var edit = canAdd(), flatId = cur.id, picking = false, st = {}, m;
    var wrap = el('div', 'axd-detail'), left = el('div', 'axd-pic'), right = el('div', 'ax-stack axd-side'), big = el('img', 'axd-big');
    big.alt = img.note || 'Bild'; left.appendChild(big); show(big, img, st);
    wrap.appendChild(left); wrap.appendChild(right);

    // note and link
    var open = el('a', 'axd-open', 'Öffnen ↗'); open.target = '_blank'; open.rel = 'noopener noreferrer';
    function syncOpen() { var l = cleanLink(img.link); open.hidden = !l; if (l) open.href = l; else open.removeAttribute('href'); }
    var info = el('p', 'ax-muted'); info.setAttribute('role', 'status'); info.hidden = true;
    function say(t) { info.textContent = t || ''; info.hidden = !t; }
    if (edit) {
      var note = el('textarea', 'ax-textarea axd-note'), link = el('input', 'ax-input'), linkRow = el('div', 'ax-row');
      note.maxLength = 300; note.rows = 3; note.value = img.note || ''; note.placeholder = 'Was gefällt dir daran? Wo hast du es gesehen?';
      link.type = 'url'; link.maxLength = 500; link.inputMode = 'url'; link.placeholder = 'https://…'; link.value = img.link || '';
      var save = UI.btn('Speichern', 'primary', function () {
        var l = cleanLink(link.value);
        if (l === null) { say('Der Link muss mit http:// oder https:// beginnen.'); link.focus(); return; }
        var meta = { note: note.value.trim().slice(0, 300), link: l };
        save.disabled = true; say('');
        call(function () { return A.images.update(img, meta); }).then(function () {
          save.disabled = false; img.note = meta.note; img.link = meta.link;
          list.forEach(function (x) { if (x.id === img.id) { x.note = meta.note; x.link = meta.link; } }); link.value = meta.link; big.alt = img.note || 'Bild';
          syncOpen(); render(); UI.toast('Gespeichert.');
        }, function (e) { save.disabled = false; say(errText(e, 'Die Notiz konnte nicht gespeichert werden.')); });
      });
      linkRow.appendChild(save); linkRow.appendChild(open);
      if (img.canRemove) linkRow.appendChild(UI.btn('Bild entfernen', 'danger', function (ev) {
        var b = ev.currentTarget;
        UI.confirm('Dieses Bild endgültig entfernen?', 'Entfernen', true).then(function (ok) {
          if (!ok) return;
          b.disabled = true;
          call(function () { return A.images.remove(img); }).then(function () {
            list = list.filter(function (i) { return i.id !== img.id; }); delete urls[img.id];
            m.close(); render(); UI.toast('Bild entfernt.');
          }, function (e) { b.disabled = false; say(errText(e, 'Das Bild konnte nicht entfernt werden.')); });
        });
      }));
      right.appendChild(field('Notiz (höchstens 300 Zeichen)', note)); right.appendChild(field('Link zum Beitrag oder zum Laden', link)); right.appendChild(linkRow);
    } else {
      if (img.note) right.appendChild(el('p', 'axd-text', img.note));
      right.appendChild(open);
      if (!img.note && !cleanLink(img.link)) right.appendChild(el('p', 'ax-muted', 'Zu diesem Bild gibt es keine Notiz.'));
    }
    syncOpen(); right.appendChild(info);

    // model a piece from the picture by hand
    var shapes = []; try { shapes = P.shapes() || []; } catch (e) {}
    if (edit && shapes.length) {
      var box = el('div', 'ax-stack axd-build'), sel = el('select', 'ax-input'), name = el('input', 'ax-input'), dims = el('div', 'axd-dims');
      var color = el('input', 'axd-color'), crow = el('div', 'ax-row'), touched = {}, inputs = {};
      var buildInfo = el('p', 'ax-muted'); buildInfo.setAttribute('role', 'status'); buildInfo.hidden = true;
      var tell = function (t) { buildInfo.textContent = t || ''; buildInfo.hidden = !t; };
      shapes.forEach(function (s, i) { var o = el('option', '', s.label); o.value = String(i); sel.appendChild(o); });
      name.type = 'text'; name.maxLength = 60; name.placeholder = 'z. B. Sessel aus dem Laden';
      [['w', 'Breite (cm)'], ['d', 'Tiefe (cm)'], ['h', 'Höhe (cm)']].forEach(function (k) {
        var i = el('input', 'ax-input'); i.type = 'number'; i.min = '0.5'; i.max = '1000'; i.step = 'any'; i.inputMode = 'decimal';
        i.addEventListener('input', function () { touched[k[0]] = true; });
        inputs[k[0]] = i; dims.appendChild(field(k[1], i));
      });
      color.type = 'color'; color.setAttribute('aria-label', 'Farbe'); color.addEventListener('input', function () { touched.color = true; });
      var fill = function () {
        var s = shapes[+sel.value] || shapes[0];
        ['w', 'd', 'h'].forEach(function (k) { if (!touched[k]) inputs[k].value = cm(s[k]); });
        if (!touched.color) color.value = /^#[0-9a-f]{6}$/i.test(s.color || '') ? s.color.toLowerCase() : '#c9a877';
      };
      sel.addEventListener('change', fill); fill();
      var setPicking = function (on) {
        picking = on; big.classList.toggle('axd-pick', on); pickBtn.setAttribute('aria-pressed', String(on));
        if (on) tell('Klick jetzt im Bild auf die Stelle mit der Farbe.');
      };
      var pickBtn = UI.btn('Farbe aus dem Bild nehmen', 'small', function () {
        if (picking) { setPicking(false); tell(''); return; }
        if (st.failed || !big.naturalWidth) { tell('Das Bild ist noch nicht geladen.'); return; }
        if (!st.cors) { tell(T.pickFail); return; }
        setPicking(true);
      });
      big.addEventListener('click', function (e) {
        if (!picking) return;
        setPicking(false);
        try {
          var r = big.getBoundingClientRect(), W = big.naturalWidth, H = big.naturalHeight, n = Math.max(1, Math.round(Math.max(W, H) / 200));
          var x = Math.floor((e.clientX - r.left) / r.width * W), y = Math.floor((e.clientY - r.top) / r.height * H);
          var sx = Math.max(0, Math.min(W - n, x - (n >> 1))), sy = Math.max(0, Math.min(H - n, y - (n >> 1)));
          var c = document.createElement('canvas'); c.width = c.height = 1;
          var g = c.getContext('2d'); g.drawImage(big, sx, sy, n, n, 0, 0, 1, 1);      // a small patch averaged into one pixel
          var p = g.getImageData(0, 0, 1, 1).data;
          color.value = '#' + hex(p[0]) + hex(p[1]) + hex(p[2]); touched.color = true;
          tell('Farbe übernommen.');
        } catch (x2) { tell(T.pickFail); }
      });
      crow.appendChild(color); crow.appendChild(pickBtn);
      var place = UI.btn('In die Wohnung stellen', 'primary', function () {
        var s = shapes[+sel.value] || shapes[0], v = { w: num(inputs.w.value), d: num(inputs.d.value), h: num(inputs.h.value) }, bad = null;
        ['w', 'd', 'h'].forEach(function (k) { if (!bad && !(isFinite(v[k]) && v[k] >= 0.5 && v[k] <= 1000)) bad = k; });
        if (bad) { tell('Breite, Tiefe und Höhe müssen zwischen 0,5 und 1000 cm liegen.'); inputs[bad].focus(); return; }
        if (cur.id !== flatId || !canAdd()) { tell('Die Wohnung auf dem Bildschirm hat gewechselt. Schliess das Fenster und öffne das Bild nochmals.'); return; }
        var nm = name.value.trim().slice(0, 60) || s.label, id = null;
        try { UI.quietSelect(800); id = P.addItem({ shape: s.key, name: nm, w: v.w / 100, d: v.d / 100, h: v.h / 100, color: color.value }); } catch (e) { id = null; }
        if (!id) { tell('Das Möbel konnte nicht in die Wohnung gestellt werden. Prüf die Masse.'); return; }
        m.close(); UI.toast(nm + ' steht in der Wohnung. Zieh es an seinen Platz.', 4500);
      });
      box.appendChild(el('h3', 'ax-h', 'Möbel daraus nachbauen'));
      box.appendChild(el('p', 'ax-muted', 'Siehst du auf dem Bild ein Möbel, das du willst? Wähl die Form, trag die Masse ein und stell es in die Wohnung.'));
      box.appendChild(field('Form', sel)); box.appendChild(field('Name', name)); box.appendChild(dims);
      var cl = el('div', 'ax-label'); cl.appendChild(el('span', '', 'Farbe')); cl.appendChild(crow); box.appendChild(cl);
      box.appendChild(buildInfo); box.appendChild(place);
      box.appendChild(el('p', 'ax-muted', 'Mit einem verbundenen KI-Assistenten kannst du auch einfach darum bitten, das Möbel von diesem Bild nachzubauen.'));
      right.appendChild(box);
    }
    m = UI.modal({ title: 'Bild', wide: true, body: wrap, actions: [{ label: 'Schliessen', onClick: function (api) { api.close(); } }] });
  }

  // ---- Start
  try {
    P.on('flat', function () { try { sync(false); } catch (e) {} });
    P.on('account', function () { try { sync(false); } catch (e) {} });
    if (window.MutationObserver) new window.MutationObserver(function () { if (!pane.hidden) { try { sync(true); } catch (e) {} } }).observe(pane, { attributes: true, attributeFilter: ['hidden'] });
    sync(true);
  } catch (e) {}
})();

</script>
